name: KenEyeCue Strict Review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  strict-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required review files
        run: |
          test -f AGENTS.md
          test -f docs/STRICT_REVIEW_SYSTEM.md
          test -f docs/BRAND_GLOSSARY.md
          test -f docs/CONTENT_REVIEW_SYSTEM.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/keneyecue-task.yml

      - name: Check forbidden absolute claims in changed user-facing files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_PATTERN='一定會|必然|保證|改運成功|招財保證|開運眉|命中註定|註定|命不好'
          TEXT_PATTERN='一定會|必然|保證|100%|改運成功|招財保證|開運眉|命中註定|註定|命不好'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi

          FAILED=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue

            case "$file" in
              .github/*|AGENTS.md|docs/STRICT_REVIEW_SYSTEM.md|docs/BRAND_GLOSSARY.md|docs/CONTENT_REVIEW_SYSTEM.md|docs/AGENT_BUILDER_MIGRATION.md|agent-builder-exports/*)
                continue
                ;;
              *.html|*.js|*.ts|*.tsx|*.json)
                if grep -nE "$BASE_PATTERN" "$file"; then
                  echo "❌ $file 發現高風險絕對化語言。"
                  FAILED=1
                fi
                ;;
              *.md)
                if grep -nE "$TEXT_PATTERN" "$file"; then
                  echo "❌ $file 發現高風險絕對化語言。"
                  FAILED=1
                fi
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$FAILED" -ne 0 ]; then
            echo '請將對外內容改為象徵性、趨勢性、方向性語句。'
            exit 1
          fi

          echo '✅ 本次變更未發現高風險絕對化語言。'

      - name: Check KenEyeCue core language
        run: |
          set -e
          if ! grep -RInE '眉眼訊號|眉眼結構|第一印象校準|視覺權威' AGENTS.md docs/STRICT_REVIEW_SYSTEM.md docs/BRAND_GLOSSARY.md docs/CONTENT_REVIEW_SYSTEM.md .github/PULL_REQUEST_TEMPLATE.md | head -n 1; then
            echo '❌ 未找到 KenEyeCue 核心語言：眉眼訊號／眉眼結構／第一印象校準／視覺權威。'
            exit 1
          fi
          echo '✅ 已找到 KenEyeCue 核心語言。'

      - name: Print strict review reminder
        run: |
          echo 'KenEyeCue Strict Review completed.'
          echo 'AI 初稿／複審完成；最終定稿由 Ken 決定。'
